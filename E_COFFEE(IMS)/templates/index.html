<!-- templates/index.html -->
{% extends 'base.html' %}

{% block title %}Trang chủ | E-COFFEE{% endblock %}
{% block head_extra %}<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">{% endblock %}

{% block content %}
<section class="home">
    <div class="slider">
        <figure>
            <div class="slide">
                <img src="{{ url_for('static', filename='images/bg-1.jpg') }}" alt="Slide 1">
            </div>
            <div class="slide">
                <img src="{{ url_for('static', filename='images/bg-2.jpg') }}" alt="Slide 2">
            </div>
            <div class="slide">
                <img src="{{ url_for('static', filename='images/bg-3.jpg') }}" alt="Slide 3">
            </div>
        </figure>
    </div>
</section>
{% endblock %}
